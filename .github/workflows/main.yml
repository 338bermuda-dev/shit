name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp -R "build/TrapSnare_artefacts/Release/VST3/Trap Snare.vst3" dist/
          if [ "$RUNNER_OS" == "macOS" ]; then
            cp -R "build/TrapSnare_artefacts/Release/AU/Trap Snare.component" dist/
            codesign --force --deep -s - "dist/Trap Snare.vst3"
            codesign --force --deep -s - "dist/Trap Snare.component"
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: Trap-Snare-${{ matrix.name }}
          path: dist
